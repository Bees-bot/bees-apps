name: Check app packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm run check
      - run: npm run build:catalog
      - uses: actions/upload-artifact@v4
        with:
          name: app-directory
          path: dist
